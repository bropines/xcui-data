name: Links

# Weekly: every geo file still answers a page (CORS) at about the size the
# data says, and every app download link still answers. A red run names each
# dead or moved address; the data itself is published by pages.yml as usual.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun scripts/check-links.ts
