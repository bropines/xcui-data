name: Release

# On a version tag: check everything once more, then attach the package
# tarball to the GitHub Release. The editor installs that tarball (the URL in
# its package.json is the pin) and bundles its snapshot as the copy it starts
# with; newer data reaches it from Pages without a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: The tag is the package version
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, package.json says $version"
            exit 1
          fi
      - run: bun run check
      - run: bun test
      - run: bun scripts/check-history.ts
      - run: bun run typecheck
      - name: Pack
        run: npm pack
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
          gh release upload "$GITHUB_REF_NAME" xcui-data-*.tgz --clobber
